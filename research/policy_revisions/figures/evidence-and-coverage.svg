  <g id="text_34">
   <text style="font-size: 9px; font-family: 'Noto Sans CJK JP'" transform="translate(15.84 345.741188)">합성 평가 768개 = 숫자·사업명 정규화 뒤 40개 표현. 문맥 모델은 고정 KLUE-RoBERTa + 선형 분류기.</text>
   <text style="font-size: 9px; font-family: 'Noto Sans CJK JP'" transform="translate(15.84 359.980594)">오류 0건은 132개 응답에 한정되며 정정·정책 변경에는 0개 응답. 공식 구절 5개에서는 채택한 1개가 오답.</text>
   <text style="font-size: 9px; font-family: 'Noto Sans CJK JP'" transform="translate(15.84 374.22)">AI 구성 정답·선정 공식 사례의 임시 판독이며, 독립 사람 평가와 실제 정책 일반화 검증 전.</text>
  </g>
